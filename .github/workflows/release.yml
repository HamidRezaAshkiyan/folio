name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: folio-macos-arm64
            ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: folio-macos-x64
            ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: folio-linux-x64
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: folio-windows-x64
            ext: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Unix archive
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.asset_name }}
          cp target/${{ matrix.target }}/release/folio dist/${{ matrix.asset_name }}/
          cp README.md LICENSE dist/${{ matrix.asset_name }}/
          tar -czf dist/${{ matrix.asset_name }}.tar.gz -C dist/${{ matrix.asset_name }} .

      - name: Package Windows archive
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/${{ matrix.asset_name }}
          Copy-Item target/${{ matrix.target }}/release/folio.exe dist/${{ matrix.asset_name }}/
          Copy-Item README.md, LICENSE dist/${{ matrix.asset_name }}/
          Compress-Archive -Path dist/${{ matrix.asset_name }}/* -DestinationPath dist/${{ matrix.asset_name }}.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}.${{ matrix.ext }}

  publish:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum folio-* > SHA256SUMS.txt

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "Folio ${GITHUB_REF_NAME}" \
            --generate-notes
