name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (ARM64, x64 & Universal .pkg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build Apple Silicon & Intel binaries
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Package .tar.gz archives
        run: |
          mkdir -p dist/folio-macos-arm64 dist/folio-macos-x64
          cp target/aarch64-apple-darwin/release/folio README.md LICENSE dist/folio-macos-arm64/
          cp target/x86_64-apple-darwin/release/folio README.md LICENSE dist/folio-macos-x64/
          tar -czf dist/folio-macos-arm64.tar.gz -C dist/folio-macos-arm64 .
          tar -czf dist/folio-macos-x64.tar.gz -C dist/folio-macos-x64 .

      - name: Build Universal macOS Folio.app & .pkg installer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION:-1.10.0}"
          mkdir -p pkgroot/usr/local/bin
          lipo -create \
            target/aarch64-apple-darwin/release/folio \
            target/x86_64-apple-darwin/release/folio \
            -output pkgroot/usr/local/bin/folio
          chmod 755 pkgroot/usr/local/bin/folio

          # Assemble Folio.app bundle (Universal GUI + icon)
          APP="dist/Folio.app"
          mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Resources"
          cp pkgroot/usr/local/bin/folio "${APP}/Contents/MacOS/folio"
          cp packaging/macos/folio-gui "${APP}/Contents/MacOS/folio-gui"
          chmod 755 "${APP}/Contents/MacOS/folio" "${APP}/Contents/MacOS/folio-gui"
          cp assets/folio.icns "${APP}/Contents/Resources/folio.icns"
          sed "s/{{VERSION}}/${VERSION}/g" packaging/macos/Info.plist > "${APP}/Contents/Info.plist"

          # Portable macOS .app zip
          (cd dist && zip -r -q Folio-macos-universal.app.zip Folio.app)

          # Include /Applications/Folio.app in Universal .pkg installer
          mkdir -p pkgroot/Applications
          cp -R "${APP}" pkgroot/Applications/Folio.app

          pkgbuild \
            --root pkgroot \
            --identifier com.hamidrezaashkiyan.folio \
            --version "${VERSION}" \
            --install-location / \
            dist/folio-macos-universal.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: |
            dist/folio-macos-arm64.tar.gz
            dist/folio-macos-x64.tar.gz
            dist/folio-macos-universal.pkg
            dist/Folio-macos-universal.app.zip

  build-linux:
    name: Build Linux (x64 .tar.gz & .deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Linux binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package .tar.gz archive
        run: |
          mkdir -p dist/folio-linux-x64
          cp target/x86_64-unknown-linux-gnu/release/folio README.md LICENSE dist/folio-linux-x64/
          tar -czf dist/folio-linux-x64.tar.gz -C dist/folio-linux-x64 .

      - name: Build Debian/Ubuntu .deb installer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION:-1.5.0}"
          mkdir -p deb/DEBIAN deb/usr/bin deb/usr/share/doc/folio
          cp target/x86_64-unknown-linux-gnu/release/folio deb/usr/bin/folio
          chmod 755 deb/usr/bin/folio
          cp README.md LICENSE deb/usr/share/doc/folio/
          cat <<EOF > deb/DEBIAN/control
          Package: folio
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: HamidRezaAshkiyan <hamidrezaashkiyan@gmail.com>
          Description: Minimalistic cross-platform Bullet Journal (TUI + GUI) backed by Obsidian Markdown
          EOF
          dpkg-deb --build deb dist/folio-linux-x64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: |
            dist/folio-linux-x64.tar.gz
            dist/folio-linux-x64.deb

  build-windows:
    name: Build Windows (x64 .zip & Setup .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Windows binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package .zip archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/folio-windows-x64 | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/folio.exe, README.md, LICENSE dist/folio-windows-x64/
          Compress-Archive -Path dist/folio-windows-x64/* -DestinationPath dist/folio-windows-x64.zip -Force

      - name: Build Windows Setup Wizard (.exe) with Inno Setup
        shell: pwsh
        run: |
          $Version = if ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_NAME.StartsWith("v")) { $env:GITHUB_REF_NAME.Substring(1) } else { "1.5.0" }
          $Iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $Iscc) {
            $DefaultIscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $DefaultIscc) {
              $Iscc = $DefaultIscc
            } else {
              choco install innosetup -y --no-progress
              $Iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            }
          } else {
            $Iscc = $Iscc.Source
          }
          & $Iscc "/DAppVersion=$Version" "packaging\windows\folio.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            dist/folio-windows-x64.zip
            dist/folio-windows-x64-setup.exe

  publish:
    name: Create GitHub Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Include shell & PowerShell installers and checksums
        run: |
          cp packaging/install.sh artifacts/install.sh
          cp packaging/install.ps1 artifacts/install.ps1
          cd artifacts
          sha256sum folio-* Folio-* install.sh install.ps1 > SHA256SUMS.txt

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" artifacts/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Folio ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
